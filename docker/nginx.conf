# Config de Nginx para servir la SPA (single-page app) del Bar POS.
# Clave: cualquier ruta que no sea un archivo real cae a index.html, para que
# el router de React (React Router) maneje la navegación del lado del cliente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea los assets con hash (JS/CSS/imágenes) de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
